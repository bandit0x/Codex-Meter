<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Capacity — 600×260 design prototype</title>
    <style>
      :root {
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        color: #f6fcff;
        font-synthesis: none;
        --cyan: #50d8ff;
        --mint: #74efd2;
        --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 600px;
        height: 260px;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 18% 18%, rgba(52, 122, 168, 0.2), transparent 32%),
          radial-gradient(circle at 84% 74%, rgba(26, 112, 99, 0.14), transparent 36%),
          linear-gradient(140deg, #111c29, #09121d 56%, #0c1722);
      }

      body.light {
        background:
          radial-gradient(circle at 18% 18%, rgba(96, 168, 205, 0.2), transparent 32%),
          radial-gradient(circle at 84% 74%, rgba(78, 177, 151, 0.14), transparent 36%),
          linear-gradient(140deg, #edf3f7, #dce6ec 56%, #f5f8fa);
      }

      body.light .workspace-ghost {
        opacity: 0.38;
        filter: blur(2.6px);
      }

      .workspace-ghost {
        position: absolute;
        inset: 0;
        opacity: 0.28;
        filter: blur(3px);
        background:
          linear-gradient(90deg, transparent 0 48px, rgba(127, 165, 188, 0.18) 48px 49px, transparent 49px),
          linear-gradient(180deg, transparent 0 32px, rgba(127, 165, 188, 0.16) 32px 33px, transparent 33px),
          linear-gradient(90deg, rgba(45, 75, 96, 0.18) 0 116px, transparent 116px);
      }

      .workspace-ghost::before,
      .workspace-ghost::after {
        content: "";
        position: absolute;
        left: 146px;
        height: 7px;
        border-radius: 999px;
        background: rgba(153, 188, 208, 0.2);
        box-shadow:
          0 24px rgba(80, 174, 210, 0.18),
          0 48px rgba(160, 129, 202, 0.14),
          0 72px rgba(114, 195, 159, 0.15),
          0 96px rgba(153, 188, 208, 0.15),
          0 120px rgba(80, 174, 210, 0.13);
      }

      .workspace-ghost::before { top: 38px; width: 248px; }
      .workspace-ghost::after { top: 50px; width: 174px; left: 178px; }

      .overlay {
        position: relative;
        width: 580px;
        height: 240px;
        overflow: hidden;
        display: grid;
        grid-template-rows: 194px 46px;
        border-radius: 34px;
        isolation: isolate;
        background:
          radial-gradient(140% 82% at 50% -18%, rgba(133, 213, 247, 0.14), transparent 58%),
          linear-gradient(145deg, rgba(44, 106, 139, 0.12), transparent 38%),
          rgba(5, 17, 28, 0.73);
        box-shadow:
          0 22px 52px rgba(0, 5, 13, 0.46),
          0 4px 13px rgba(0, 5, 13, 0.34),
          inset 0 1px 0 rgba(235, 250, 255, 0.42),
          inset 0 -1px 0 rgba(80, 157, 194, 0.2);
        backdrop-filter: blur(28px) saturate(152%);
        animation: shell-arrive 420ms var(--ease-out-expo) both;
      }

      .overlay::before {
        content: "";
        position: absolute;
        z-index: 10;
        inset: 0;
        pointer-events: none;
        padding: 1px;
        border-radius: inherit;
        background: linear-gradient(
          128deg,
          rgba(226, 249, 255, 0.94),
          rgba(92, 206, 255, 0.62) 22%,
          rgba(120, 178, 210, 0.18) 50%,
          rgba(116, 239, 210, 0.62) 78%,
          rgba(226, 249, 255, 0.86)
        );
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
      }

      .overlay::after {
        content: "";
        position: absolute;
        z-index: 9;
        inset: 5px;
        pointer-events: none;
        border-radius: 29px;
        border: 1px solid rgba(183, 229, 249, 0.14);
        box-shadow:
          inset 0 12px 24px rgba(164, 226, 250, 0.055),
          inset 0 -10px 20px rgba(0, 2, 8, 0.22);
      }

      .glint {
        position: absolute;
        z-index: 11;
        top: 2px;
        left: -30%;
        width: 42%;
        height: 1px;
        pointer-events: none;
        opacity: 0;
        background: linear-gradient(90deg, transparent, rgba(240, 253, 255, 0.92), transparent);
        filter: blur(0.2px);
        animation: rim-glint 9s 2.2s ease-in-out infinite;
      }

      .chambers {
        position: relative;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .seam {
        position: absolute;
        z-index: 8;
        top: 8px;
        bottom: 8px;
        left: 50%;
        width: 3px;
        transform: translateX(-50%);
        pointer-events: none;
        background: linear-gradient(
          90deg,
          rgba(0, 4, 9, 0.62),
          rgba(220, 247, 255, 0.62) 48%,
          rgba(0, 4, 9, 0.44)
        );
        box-shadow:
          -5px 0 16px rgba(25, 143, 192, 0.08),
          5px 0 16px rgba(52, 187, 157, 0.07);
        opacity: 0.72;
      }

      .chamber {
        --accent: var(--cyan);
        --liquid-top: #08b7ef;
        --liquid-bottom: #043b62;
        position: relative;
        min-width: 0;
        overflow: hidden;
      }

      .chamber--mint {
        --accent: var(--mint);
        --liquid-top: #21c6aa;
        --liquid-bottom: #064d4b;
      }

      .chamber::after {
        content: "";
        position: absolute;
        z-index: 7;
        inset: 8px 7px 6px;
        pointer-events: none;
        border: 1px solid rgba(190, 232, 250, 0.2);
        border-radius: 25px 18px 18px 24px;
        box-shadow:
          inset 1px 0 0 rgba(240, 253, 255, 0.13),
          inset 0 10px 18px rgba(159, 220, 245, 0.035),
          inset 0 -9px 15px rgba(0, 4, 10, 0.2);
      }

      .chamber--mint::after { border-radius: 18px 25px 24px 18px; }

      .liquid {
        position: absolute;
        z-index: 1;
        left: 7px;
        right: 7px;
        top: var(--level);
        bottom: 6px;
        overflow: visible;
        clip-path: polygon(
          0 6px,
          12% 8px,
          28% 11px,
          44% 13px,
          60% 12px,
          76% 9px,
          90% 6px,
          100% 5px,
          100% 100%,
          0 100%
        );
        background:
          radial-gradient(ellipse at 22% 12%, rgba(255, 255, 255, 0.2), transparent 29%),
          radial-gradient(ellipse at 78% 38%, color-mix(in srgb, var(--accent) 17%, transparent), transparent 42%),
          linear-gradient(180deg, color-mix(in srgb, var(--liquid-top) 80%, white 6%), var(--liquid-bottom));
        box-shadow:
          inset 0 15px 24px color-mix(in srgb, var(--accent) 14%, transparent),
          0 -10px 22px color-mix(in srgb, var(--accent) 17%, transparent);
        opacity: 0.88;
        animation:
          liquid-settle 720ms 120ms var(--ease-out-expo) both,
          liquid-breathe 8s 1s ease-in-out infinite alternate;
      }

      .liquid::before {
        content: "";
        position: absolute;
        top: 2px;
        left: -7%;
        width: 114%;
        height: 17px;
        border-top: 1.5px solid color-mix(in srgb, var(--accent) 74%, white);
        border-radius: 50%;
        box-shadow:
          0 -1px 0 rgba(244, 253, 255, 0.54),
          0 3px 13px color-mix(in srgb, var(--accent) 40%, transparent);
        transform: rotate(-0.65deg);
        animation: meniscus-drift 6.8s ease-in-out infinite alternate;
      }

      .liquid::after {
        content: "";
        position: absolute;
        inset: 14px 10% 0;
        opacity: 0.42;
        background:
          linear-gradient(110deg, transparent 0 42%, rgba(206, 247, 255, 0.08) 43% 44%, transparent 45%),
          radial-gradient(ellipse at 50% 112%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 64%);
      }

      .content {
        position: relative;
        z-index: 5;
        height: 100%;
        padding: 21px 27px 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-shadow: 0 1px 10px rgba(0, 5, 12, 0.42);
      }

      .label {
        font-size: 16px;
        font-weight: 650;
        letter-spacing: 0.055em;
      }

      .value {
        margin-top: 1px;
        display: flex;
        align-items: baseline;
        gap: 7px;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      .value strong {
        font-size: 61px;
        line-height: 1.02;
        font-weight: 390;
        letter-spacing: -0.055em;
      }

      .value span {
        font-size: 18px;
        font-weight: 510;
      }

      .reset {
        margin-top: auto;
        font-size: 14px;
        font-weight: 480;
        font-variant-numeric: tabular-nums;
        color: #eaf8fc;
      }

      .ticks {
        width: 78%;
        height: 9px;
        margin-top: 7px;
        opacity: 0.72;
        border-bottom: 1px solid var(--accent);
        background: repeating-linear-gradient(
          90deg,
          transparent 0 8px,
          color-mix(in srgb, var(--accent) 68%, white) 8px 9px
        );
        mask-image: linear-gradient(to bottom, transparent 0 3px, #000 3px);
      }

      footer {
        position: relative;
        z-index: 8;
        display: grid;
        grid-template-columns: 1fr auto 42px;
        align-items: center;
        padding: 0 7px 0 27px;
        gap: 14px;
        border-top: 1px solid rgba(171, 226, 248, 0.18);
        background:
          linear-gradient(180deg, rgba(11, 35, 50, 0.2), rgba(3, 12, 21, 0.34));
        color: #b9cfdb;
        font-size: 14px;
        letter-spacing: 0.018em;
        font-variant-numeric: tabular-nums;
      }

      footer b { color: var(--mint); font-weight: 700; }

      .expand {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 13px;
        background: transparent;
        color: #effaff;
      }

      .expand svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 8px rgba(120, 222, 255, 0.2));
      }

      @keyframes shell-arrive {
        from { opacity: 0; transform: scale(0.982); filter: blur(5px); }
        to { opacity: 1; transform: scale(1); filter: blur(0); }
      }

      @keyframes liquid-settle {
        from { transform: translateY(22px); opacity: 0.25; }
        72% { transform: translateY(-2px); opacity: 0.9; }
        to { transform: translateY(0); opacity: 0.88; }
      }

      @keyframes liquid-breathe {
        from { filter: saturate(0.96) brightness(0.98); }
        to { filter: saturate(1.05) brightness(1.035); }
      }

      @keyframes meniscus-drift {
        from { transform: translateX(-3px) rotate(-0.55deg) scaleY(0.96); }
        to { transform: translateX(3px) rotate(0.5deg) scaleY(1.04); }
      }

      @keyframes rim-glint {
        0%, 70% { transform: translateX(0); opacity: 0; }
        76% { opacity: 0.7; }
        88% { transform: translateX(890px); opacity: 0.18; }
        100% { transform: translateX(890px); opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="workspace-ghost" aria-hidden="true"></div>
    <main class="overlay" aria-label="Codex 配额浮窗设计原型">
      <span class="glint" aria-hidden="true"></span>
      <div class="chambers">
        <span class="seam" aria-hidden="true"></span>
        <section class="chamber" style="--level: 52%">
          <div class="liquid" aria-hidden="true"></div>
          <div class="content">
            <div class="label">5 HOUR</div>
            <div class="value"><strong>76%</strong><span>LEFT</span></div>
            <div class="reset">Resets 14:32</div>
            <div class="ticks" aria-hidden="true"></div>
          </div>
        </section>
        <section class="chamber chamber--mint" style="--level: 68%">
          <div class="liquid" aria-hidden="true"></div>
          <div class="content">
            <div class="label">WEEK</div>
            <div class="value"><strong>42%</strong><span>LEFT</span></div>
            <div class="reset">Resets Tue 09:00</div>
            <div class="ticks" aria-hidden="true"></div>
          </div>
        </section>
      </div>
      <footer>
        <span>FULL RESETS <b>2</b></span>
        <span>Updated now</span>
        <button class="expand" type="button" aria-label="展开详情">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 9.5 12 13.5 16 9.5" />
          </svg>
        </button>
      </footer>
    </main>
    <script>
      if (new URLSearchParams(location.search).has("light")) {
        document.body.classList.add("light");
      }
    </script>
  </body>
</html>
